name: Bug report
description: Report reproducible unexpected behavior.
title: 'fix: '
labels: ['type: bug', 'status: triage']
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include device, browser, note state, and relevant logs if known.
